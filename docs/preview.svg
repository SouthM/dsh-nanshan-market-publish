<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Two independent tracks: submit the component to GitHub, then open the market listing PR">
  <rect x="0.5" y="0.5" width="639" height="299" rx="14" fill="#FFFFFF" stroke="#E6E6E9"/>
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#16171A">DSH 插件市场发布助手</text>
  <text x="32" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4" fill="#6B6F76">TWO INDEPENDENT TRACKS</text>

  <rect x="32" y="88" width="276" height="168" rx="10" fill="#FCFCFD" stroke="#E6E6E9"/>
  <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#16171A">1 · 提交到 GitHub</text>
  <text x="50" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1" fill="#6B6F76">GITHUB</text>

  <rect x="50" y="142" width="240" height="24" rx="6" fill="#FFFFFF" stroke="#E6E6E9"/>
  <text x="62" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#16171A">git init -b main</text>
  <rect x="50" y="172" width="240" height="24" rx="6" fill="#FFFFFF" stroke="#E6E6E9"/>
  <text x="62" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#16171A">POST /user/repos → 公开仓库</text>
  <rect x="50" y="202" width="240" height="24" rx="6" fill="#FFFFFF" stroke="#E6E6E9"/>
  <text x="62" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#16171A">git push -u origin HEAD:main</text>
  <rect x="50" y="232" width="240" height="24" rx="6" fill="#F4F5FF" stroke="#D9DCFF"/>
  <text x="62" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5E6AD2">+ topic  dsh-plugin</text>
  <text x="256" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#2F9E77">✓</text>
  <text x="256" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#2F9E77">✓</text>
  <text x="256" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#2F9E77">✓</text>
  <text x="256" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#2F9E77">✓</text>

  <path d="M318 172h18m-5-5 5 5-5 5" fill="none" stroke="#C9CBD2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="348" y="88" width="260" height="168" rx="10" fill="#FCFCFD" stroke="#E6E6E9"/>
  <text x="366" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#16171A">2 · 申请市场收录 PR</text>
  <text x="366" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1" fill="#6B6F76">AWESOME-DSH-PLUGIN</text>

  <rect x="366" y="142" width="224" height="24" rx="6" fill="#FFFFFF" stroke="#E6E6E9"/>
  <text x="378" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#16171A">data/plugins/owner__repo.yml</text>
  <rect x="366" y="172" width="224" height="24" rx="6" fill="#FFFFFF" stroke="#E6E6E9"/>
  <text x="378" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#16171A">fork → 分支 → 写入条目</text>
  <rect x="366" y="202" width="224" height="24" rx="6" fill="#F4F5FF" stroke="#D9DCFF"/>
  <text x="378" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5E6AD2">POST /pulls  →  等待评审</text>
  <text x="560" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#2F9E77">✓</text>
  <text x="560" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#2F9E77">✓</text>
  <text x="560" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#B7791F">…</text>

  <text x="32" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6B6F76">两条轨道互相独立：GitHub 提交只让插件可安装；收录 PR 才让它出现在市场列表里。</text>
</svg>
